services:
  hormiga:
    build: .
    container_name: hormiga
    restart: unless-stopped

    # Clave: se publica SOLO en localhost del VPS.
    # Sin el 127.0.0.1 adelante, Docker abre el puerto al mundo saltándose
    # el firewall, y la app queda accesible por IP:3001 sin TLS.
    # El nginx que ya tenés en el server es el que la expone por HTTPS.
    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - ./data:/data

    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/hormiga.db
      REGISTRATION_CODE: ${REGISTRATION_CODE:?definí REGISTRATION_CODE en el .env antes de levantar esto}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
